name: Generate MBJSON parser

on:
  push:
    paths:
      - "grammar.js"
      - ".github/workflows/generate-mbjson.yml"
      - "trigger.txt"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tree-sitter CLI
        run: cargo install tree-sitter-cli --version 0.22.6 --locked

      - name: Generate parser sources
        run: tree-sitter generate

      - name: Verify link_arrow node
        run: |
          grep -n '"link_arrow"' src/node-types.json
          grep -n 'sym_link_arrow' src/parser.c

      - name: Commit generated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/parser.c src/grammar.json src/node-types.json
          git commit -m "Generate MBJSON parser sources" || exit 0
          git push
